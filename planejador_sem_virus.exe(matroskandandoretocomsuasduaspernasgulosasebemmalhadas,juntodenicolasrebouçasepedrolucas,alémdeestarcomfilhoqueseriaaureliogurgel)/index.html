<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Meu Planejador de Estudos</title>
</head>
<body>
    <div class="container">
        <h1 id="titulo">Meu Planejador de Estudos</h1>

        <h2>Nova tarefa</h2>

        <input type="text" id="tarefa" placeholder="Digite o nome da tarefa">
        <input type="text" id="materia" placeholder="Digite a matéria">

        <select id="prioridade">
            <option value="">Selecione a prioridade</option>
            <option value="Baixa">Baixa</option>
            <option value="Média">Média</option>
            <option value="Alta">Alta</option>
        </select>

        <button type="button" onclick="adicionarTarefa()">
            Cadastrar tarefa
        </button>

        <button type="button" onclick="limparCampos()">
            Limpar campos
        </button>

        <p id="mensagem"></p>

        <div class="contadores">
            <p id="contador">Tarefas cadastradas: 0</p>
            <p id="contadorConcluidas">Tarefas concluídas: 0</p>
        </div>

        <button type="button" onclick="alternarModo()">
            Modo de concentração
        </button>

        <h2>Minhas tarefas</h2>

        <div id="listaTarefas"></div>
    </div>

    <script src="java.js"></script>
</body>
</html>
